version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: goro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goro_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goro_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-goro_s2jb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goro_admin} -d ${POSTGRES_DB:-goro_s2jb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goro-network

  redis:
    image: redis:7-alpine
    container_name: goro-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - goro-network

  ocr-service:
    build:
      context: ./python-services/ocr
      dockerfile: Dockerfile
    container_name: goro-ocr-service
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - goro-network

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goro-web-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-goro_admin}:${POSTGRES_PASSWORD:-goro_secret_2026}@postgres:5432/${POSTGRES_DB:-goro_s2jb}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-goro-s2jb-command-center-secret-key-pln-2026-production-secured}
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goro-network

  worker-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goro-worker-ocr
    restart: always
    command: ["npm", "run", "worker:ocr"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-goro_admin}:${POSTGRES_PASSWORD:-goro_secret_2026}@postgres:5432/${POSTGRES_DB:-goro_s2jb}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goro-network

  worker-import:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goro-worker-import
    restart: always
    command: ["npm", "run", "worker:import"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-goro_admin}:${POSTGRES_PASSWORD:-goro_secret_2026}@postgres:5432/${POSTGRES_DB:-goro_s2jb}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - goro-network

volumes:
  pg_data:
    name: goro_pg_data
  redis_data:
    name: goro_redis_data
  uploads_data:
    name: goro_uploads_data
  logs_data:
    name: goro_logs_data

networks:
  goro-network:
    name: goro_network
    driver: bridge
