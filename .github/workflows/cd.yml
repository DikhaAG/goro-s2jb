name: CD - Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-to-server:
    name: Deploy to Ubuntu Production Server
    runs-on: ubuntu-latest
    # Jalankan CD hanya jika CI sebelumnya berhasil
    # Memerlukan GitHub Secrets: SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ env.SERVER_HOST != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'tam' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Memulai otomatisasi deployment GORO S2JB..."
            cd /var/www/goro-s2jb

            # 1. Jalankan script deployment otomatis
            if [ -f "scripts/deploy.sh" ]; then
              bash scripts/deploy.sh
            else
              echo "📦 Melakukan git pull dan rebuild Docker..."
              git pull origin main
              sudo docker compose up -d --build
            fi

            echo "✅ Deployment selesai dan terverifikasi!"
